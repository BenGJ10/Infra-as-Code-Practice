<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1d">
  <meta name="robots" content="noindex">
  <title>Page not found | Ben Gregory John</title>
  <style>
    :root { color-scheme: dark; --bg:#080d1d; --text:#f5f7ff; --muted:#a8b3d0; --line:rgba(174,190,255,.15); --accent:#a5b4fc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 50% 20%,rgba(79,70,229,.24),transparent 34rem),var(--bg); }
    .wrap { width:min(620px,100%); text-align:center; }
    .mark { display:inline-grid; place-items:center; width:46px; height:46px; border-radius:15px; background:linear-gradient(140deg,#6366f1,#312e81); font-weight:800; box-shadow:0 10px 30px rgba(99,102,241,.25); }
    .code { margin:36px 0 0; font-size:clamp(90px,22vw,160px); line-height:.9; letter-spacing:-.09em; font-weight:850; background:linear-gradient(120deg,#fff 15%,#a5b4fc 65%,#6366f1); color:transparent; background-clip:text; -webkit-background-clip:text; }
    h1 { margin:24px 0 9px; font-size:clamp(24px,5vw,34px); letter-spacing:-.05em; }
    p { max-width:420px; margin:0 auto; color:var(--muted); font-size:14px; line-height:1.8; }
    .actions { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:27px; }
    a { display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:12px 17px; border-radius:12px; text-decoration:none; font-size:12px; font-weight:750; transition:.2s ease; }
    .primary { color:#0b1025; background:linear-gradient(120deg,#c7d2fe,#818cf8); }
    .secondary { color:var(--text); border:1px solid var(--line); background:rgba(255,255,255,.03); }
    a:hover { transform:translateY(-3px); filter:brightness(1.08); }
    .foot { margin-top:52px; color:#7583a7; font-size:10px; }
    .foot a { display:inline; padding:0; color:var(--accent); font-size:10px; }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="mark" href="/" aria-label="Ben Gregory John home">BG</a>
    <div class="code" aria-label="Error 404">404</div>
    <h1>This page wandered off.</h1>
    <p>The page you're looking for may have moved, been renamed, or no longer exists. Let's get you back on track.</p>
    <div class="actions">
      <a class="primary" href="/">Back to homepage <span aria-hidden="true">↗</span></a>
      <a class="secondary" href="mailto:bengregoryjohn2005@gmail.com">Contact me</a>
    </div>
    <div class="foot">© <span id="year"></span> Ben Gregory John · <a href="https://bengregoryjohn.in">bengregoryjohn.in</a></div>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>

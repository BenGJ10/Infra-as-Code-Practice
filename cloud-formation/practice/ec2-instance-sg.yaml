AWSTemplateFormatVersion: "2010-09-09"

Description: "AWS CloudFormation Template: EC2 Instance with Security Groups"

Parameters:
  KeyPair:
    Description: "Name of an existing EC2 KeyPair to enable SSH access to the instance"
    Type: "AWS::EC2::KeyPair::KeyName"
    
  InstanceType:
    Description: "EC2 instance type"
    Type: "String"
    Default: "t2.micro"

Resources:
  DemoSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: Allow SSH access to EC2
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        
        - IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      

  DemoEC2Instance:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPair
      ImageId: ami-05fbd65e334e88c16
      SecurityGroupIds:
        - !GetAtt  DemoSecurityGroup.GroupId

Outputs:
  InstanceId:
    Description: "Instance ID of the newly created EC2 instance"
    Value: !Ref DemoEC2Instance
  PublicIP:
    Description: "Public IP address of the newly created EC2 instance"
    Value: !GetAtt DemoEC2Instance.PublicIp
  SecurityGroupId:
    Description: "Security Group ID of the newly created Security Group"
    Value: !GetAtt DemoSecurityGroup.GroupId
  
  